invert = true

[[scene.coordinateSystems]]
name = "input"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateSystems]]
name = "output"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateTransformations]]
name = "inputToOutput"
input = { name = "input" }
output = { name = "output" }
type = "byDimension"
transformations = [
  { transformation = { type = "identity",
  }, inputAxes = [
      0,
    ], outputAxes = [
      0,
    ]
  },
  { transformation = {type = "scale", scale = [
    10,
  ]}, inputAxes = [
    1,
  ], outputAxes = [
    1,
  ] },
]

[conformance]
description = "Simple byDimension."

should_error = false
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [[1, 2]]

[conformance.target]
name = "output"
coordinates = [[1, 20]]
