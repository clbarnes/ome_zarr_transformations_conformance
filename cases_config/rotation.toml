invert = true

[[scene.coordinateSystems]]
name = "input"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateSystems]]
name = "output"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateTransformations]]
name = "inputToOutput"
input = { name = "input" }
output = { name = "output" }
type = "rotation"
rotation = [
  [ 0.17, -0.985 ],
  [ 0.985, 0.17 ],
]

[conformance]
description = "Rotation transformation."

should_error = false
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [
  [ -1, -1 ],
  [ 0, 0 ],
  [ 1, 1 ],
  [ 2, 2 ],
]

[conformance.target]
name = "output"
coordinates = [
  [ 0.815, -1.155 ],
  [ 0.0, 0.0 ],
  [ -0.815, 1.155 ],
  [ -1.63, 2.31 ],
]
