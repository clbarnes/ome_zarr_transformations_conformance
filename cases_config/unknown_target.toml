[[scene.coordinateSystems]]
name = "input"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateSystems]]
name = "output"
axes = [{ name = "y", type = "space" }, { name = "x", type = "space" }]

[[scene.coordinateTransformations]]
name = "inputToOutput"
input = { name = "input" }
output = { name = "output" }
type = "identity"

[conformance]
description = "Target coordinate system not defined."

should_error = true
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [[1, 2]]

[conformance.target]
name = "not_output"
