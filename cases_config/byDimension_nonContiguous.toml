invert = true

[[scene.coordinateSystems]]
name = "input"
axes = [
  { name = "z", type = "space" },
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateSystems]]
name = "output"
axes = [
  { name = "z", type = "space" },
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateTransformations]]
name = "input->output"
input = { name = "input" }
output = { name = "output" }
type = "byDimension"
transformations = [
  { transformation = { type = "affine", affine = [[1, 2, 0], [3, 5, 0]] }, input_axes = [0, 2], output_axes = [0, 2] },
  { transformation = { type = "scale", scale = [10] }, input_axes = [1], output_axes = [1] },
]

[conformance]
description = "byDimension whose sub transformations work on multiple and non-contiguous indexes."

should_error = false
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [[1, 2, 3]]

[conformance.target]
name = "output"
coordinates = [[7, 20, 18]]
