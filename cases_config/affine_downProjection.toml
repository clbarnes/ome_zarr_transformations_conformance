invert = false

[[scene.coordinateSystems]]
name = "input"
axes = [
  { name = "z", type = "space" },
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateSystems]]
name = "output"
axes = [
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateTransformations]]
name = "input->output"
input = { name = "input" }
output = { name = "output" }
type = "affine"
affine = [[2, 2, 2, 0], [3, 3, 3, 0]]

[conformance]
description = "An affine performing down-projection from 3D to 2D."

should_error = false
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [[1, 2, 3]]

[conformance.target]
name = "output"
coordinates = [[12, 18]]
