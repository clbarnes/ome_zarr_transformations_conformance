invert = true

[[scene.coordinateSystems]]
name = "input"
axes = [
  { name = "z", type = "space" },
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateSystems]]
name = "output"
axes = [
  { name = "z", type = "space" },
  { name = "y", type = "space" },
  { name = "x", type = "space" },
]

[[scene.coordinateTransformations]]
name = "inputToOutput"
input = "input"
output = "output"
type = "affine"
affine = [[2, 0, 0, 20], [0, 3, 0, 60], [0, 0, 4, 120]]

[conformance]
description = "Scale and translation as an affine."

should_error = false
absolute_tolerance = 1e-6
relative_tolerance = 1e-3

[conformance.source]
name = "input"
coordinates = [[-1, -1, -1], [0, 0, 0], [1, 1, 1], [2, 2, 2]]

[conformance.target]
name = "output"
coordinates = [[18, 57, 116], [20, 60, 120], [22, 63, 124], [24, 66, 128]]
